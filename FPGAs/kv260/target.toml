# The Kria KV260, as Vivado's board store describes it.
#
# This file only names where the target's platform specification lives. The
# part, resources, interfaces, memory and clocks are all read from there --
# nothing about the board is written by hand (docs/decisions.md).

name = "KV260"

# Board-store entries, as vendor:name. The SOM carries the part and the
# processing system's preset; the carrier carries the connectors and
# interfaces. The newest version installed with the pinned tools is used.
board_store = ["xilinx.com:kv260_som", "xilinx.com:kv260_carrier"]
